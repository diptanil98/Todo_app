version: "3.9"

services:
  backend:
    build: ./backend
    container_name: mern_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend/frontend
    container_name: mern_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/frontend:/app
      - /app/node_modules
    depends_on:
      - backend